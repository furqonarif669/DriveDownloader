name: Build Drive Downloader

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Allows manual triggering

jobs:
  build-windows:
    name: Build Windows (EXE)
    runs-on: windows-latest
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyside6 requests pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller build.spec

    - name: Upload Artifact (EXE)
      uses: actions/upload-artifact@v4
      with:
        name: DriveDownloader-Windows
        path: dist/DriveDownloader.exe

  build-macos:
    name: Build macOS (APP)
    runs-on: macos-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyside6 requests pyinstaller

    - name: Build with PyInstaller
      run: |
        pyinstaller build.spec

    # PyInstaller creates a folder ending in .app. We must zip it to preserve permissions/structure.
    - name: Zip App Bundle
      run: |
        cd dist
        zip -r DriveDownloader-Mac.zip DriveDownloader.app

    - name: Upload Artifact (Zip)
      uses: actions/upload-artifact@v4
      with:
        name: DriveDownloader-Mac
        path: dist/DriveDownloader-Mac.zip